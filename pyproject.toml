[project]
name = "k-2"
version = "0.1.0"
description = "K-2: a deep agent chatbot built on deepagents, LangGraph and Streamlit"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "deepagents>=0.6.10",
    "ipykernel>=7.3.0",
    "langchain>=1.3.9",
    "langchain-google-genai>=4.2.5",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.3.2",
    "langchain-quickjs>=0.3.0",
    "python-dotenv>=1.2.2",
    "streamlit>=1.58.0",
    "tavily-python>=0.7.26",
]
